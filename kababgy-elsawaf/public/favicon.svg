<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="70%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Deep Ruby Red Background with rounded corners -->
  <rect width="120" height="120" rx="26" fill="url(#bgGlow)" />
  <rect width="116" height="116" x="2" y="2" rx="24" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Ornate Oriental Scalloped Cartouche -->
  <path d="M 60,18 
           C 72,18 78,24 84,27 
           C 92,27 98,34 98,42 
           C 103,48 103,56 103,60 
           C 103,64 103,72 98,78 
           C 98,86 92,93 84,93 
           C 78,96 72,102 60,102 
           C 48,102 42,96 36,93 
           C 28,93 22,86 22,78 
           C 17,72 17,64 17,60 
           C 17,56 17,48 22,42 
           C 22,34 28,27 36,27 
           C 42,24 48,18 60,18 Z" 
        fill="#5c0606" 
        stroke="url(#gold)" 
        stroke-width="3" />

  <!-- Inner Gold Trim -->
  <path d="M 60,24 
           C 70,24 75,29 80,31 
           C 87,31 92,37 92,44 
           C 96,49 96,56 96,60 
           C 96,64 96,71 92,76 
           C 92,83 87,89 80,89 
           C 75,91 70,96 60,96 
           C 50,96 45,91 40,89 
           C 33,89 28,83 28,76 
           C 24,71 24,64 24,60 
           C 24,56 24,49 28,44 
           C 28,37 33,31 40,31 
           C 45,29 50,24 60,24 Z" 
        fill="none" 
        stroke="url(#gold)" 
        stroke-width="1" 
        stroke-dasharray="2,2" />

  <!-- Arabic Typography "كبابجي" on top -->
  <text x="60" y="48" 
        font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" 
        font-size="12" 
        font-weight="900" 
        fill="url(#gold)" 
        text-anchor="middle" 
        letter-spacing="0.5">كبابجي</text>

  <!-- Arabic Typography "الصواف" in center -->
  <text x="60" y="74" 
        font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" 
        font-size="22" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle">الصواف</text>

  <!-- Gold Star Accents -->
  <polygon points="36,60 38,56 42,58 39,61 40,65 37,62 33,63 35,59" fill="url(#gold)" />
  <polygon points="84,60 86,56 90,58 87,61 88,65 85,62 81,63 83,59" fill="url(#gold)" />
</svg>
